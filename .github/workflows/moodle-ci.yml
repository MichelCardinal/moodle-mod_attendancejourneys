# Attendance Journeys testing only; no publishing or deployment credentials.
# Structure follows MoodleHQ moodle-plugin-ci guidance.
name: Moodle Plugin CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - {php: '8.3', moodle: MOODLE_405_STABLE, database: mysqli}
          - {php: '8.3', moodle: MOODLE_500_STABLE, database: mysqli}
          - {php: '8.3', moodle: MOODLE_501_STABLE, database: mysqli}
          - {php: '8.3', moodle: MOODLE_502_STABLE, database: mysqli}
          - {php: '8.3', moodle: MOODLE_503_STABLE, database: mysqli}
          - {php: '8.4', moodle: MOODLE_503_STABLE, database: mysqli}
          - {php: '8.3', moodle: MOODLE_503_STABLE, database: pgsql}
    services:
      mysql:
        image: ${{ matrix.database == 'mysqli' && 'mysql:8.4' || '' }}
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=10
      postgres:
        image: ${{ matrix.database == 'pgsql' && 'postgres:17' || '' }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: --health-cmd=pg_isready --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v6
        with:
          path: plugin
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: intl, sodium, mysqli, pgsql, zip, gd, soap, mbstring
          ini-values: max_input_vars=5000, memory_limit=512M
          coverage: none
      - name: Prepare MoodleHQ tools
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo "$(cd ci/bin && pwd)" >> "$GITHUB_PATH"
          echo "$(cd ci/vendor/bin && pwd)" >> "$GITHUB_PATH"
          sudo locale-gen en_AU.UTF-8
          echo "NVM_DIR=$HOME/.nvm" >> "$GITHUB_ENV"
      - name: Install isolated Moodle test environment
        run: moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1
        env:
          DB: ${{ matrix.database }}
          MOODLE_BRANCH: ${{ matrix.moodle }}
      - name: Check PHP and Moodle conventions
        run: |
          moodle-plugin-ci phplint
          moodle-plugin-ci validate
          moodle-plugin-ci savepoints
          moodle-plugin-ci phpcs --max-warnings 0
          moodle-plugin-ci phpdoc --max-warnings 0
      - name: Check JavaScript builds
        run: moodle-plugin-ci grunt --max-lint-warnings 0
      - name: Run plugin tests
        run: moodle-plugin-ci phpunit --fail-on-warning
